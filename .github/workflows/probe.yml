# Temporary: lists the Xcode versions on GitHub's macOS images and reports them as
# annotations (readable through the checks API). Remove once the build is fixed.
name: Probe macOS images

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: read

jobs:
  xcode:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: List Xcode installs and SDKs
        run: |
          apps=$(ls -d /Applications/Xcode*.app 2>/dev/null | sed 's|/Applications/||' | tr '\n' ' ')
          sel=$(xcodebuild -version 2>&1 | tr '\n' ' ')
          ios=$(xcrun --sdk iphoneos --show-sdk-version 2>&1)
          echo "::warning title=xcode probe ${{ matrix.runner }}::image=${ImageOS:-?} ${ImageVersion:-?} | selected: $sel| iOS SDK $ios | installed: $apps"
