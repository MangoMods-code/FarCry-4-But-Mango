# Temporary: checks a build download from GitHub's own network and reports it as an
# annotation (readable through the checks API). Remove once the build is fixed.
name: Probe build downloads

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: llvm-mingw release used by Madeira's 32-bit build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz"
          code=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-0 "$url")
          assets=$(gh api repos/mstorsjo/llvm-mingw/releases/tags/20260421 --jq '[.assets[].name | select(test("macos"))] | join(", ")' 2>&1 | head -c 600)
          latest=$(gh api repos/mstorsjo/llvm-mingw/releases --jq '[.[0:5][].tag_name] | join(", ")' 2>&1 | head -c 300)
          echo "::warning title=llvm-mingw probe::download HTTP=$code | 20260421 macOS assets: $assets | latest releases: $latest"
