# Generated from madeira/.github/workflows/build.yml by Mango Port (see docs/BUILDING.md).
# Differences: runs from this repo with Madeira at madeira/, applies mango/patches first,
# GitHub-hosted macOS runner (override with the MANGO_MAC_RUNNER repository variable),
# manual runs only, and the IPA cache key includes the Mango patches.
name: Build Mango Port IPA

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # Pushing to the release branch builds and publishes the newest version in docs/CHANGELOG.md.
    branches: [release]

permissions:
  contents: read

concurrency:
  group: mango-ipa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: madeira

jobs:
  plan:
    runs-on: ${{ vars.MANGO_MAC_RUNNER || 'macos-26' }}
    outputs:
      ipa: ${{ steps.key.outputs.ipa }}
      reuse: ${{ steps.ipa.outputs.cache-hit }}
      sdk: ${{ steps.sdk.outputs.key }}
      ipaenv: ${{ steps.sdk.outputs.ipa }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Madeira and apply Mango patches
        working-directory: .
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            scripts/apply-mango.sh --shallow
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - name: Select the newest Xcode
        working-directory: .
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            x=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
            xcodebuild -version
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - name: Check build reuse rules
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            python3 tests/host/check-build-inputs.py
            python3 tests/host/check-ci-component-keys.py
            python3 tests/host/check-ci-llvm-cache.py
            python3 tests/host/check-clean-bootstrap.py
            python3 tests/host/check-app-link-inputs.py
            python3 tests/host/check-runtime-components.py
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - name: Check touch control layouts and editor
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            python3 tests/host/check-control-presets.py
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - name: Check Steam connection recovery
        if: hashFiles('madeira/tests/host/check-steam-cm-transport.py') != ''
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            python3 tests/host/check-steam-cm-transport.py
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: sdk
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            bash tools/build/ci-input-key.sh
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: key
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            echo "ipa=mango-ipa-v1-${{ hashFiles('mango/patches/**') }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.ipa }}-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: ipa
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.ipa }}
          path: madeira/dist/Madeira.ipa
          lookup-only: true
      - name: Report the failing step
        if: failure()
        working-directory: .
        shell: bash
        run: |
          f="$RUNNER_TEMP/step.log"
          [ -s "$f" ] || exit 0
          msg=$(tr '\r' '\n' < "$f" | sed -e 's/\x1b\[[0-9;]*m//g' | grep -v '^[[:space:]]*$' | tail -60 | cut -c1-400 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=${GITHUB_JOB} failed (last 60 lines)::${msg}"

  reuse:
    needs: plan
    if: needs.plan.outputs.reuse == 'true'
    runs-on: ${{ vars.MANGO_MAC_RUNNER || 'macos-26' }}
    env:
      MADEIRA_PLANNED_SDK: ${{ needs.plan.outputs.sdk }}
      MADEIRA_RUNTIME_SDK: ${{ needs.plan.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Madeira and apply Mango patches
        working-directory: .
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            scripts/apply-mango.sh --shallow
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - name: Select the newest Xcode
        working-directory: .
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            x=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
            xcodebuild -version
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: sdk
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            bash tools/build/ci-input-key.sh
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.plan.outputs.ipa }}
          path: madeira/dist/Madeira.ipa
          fail-on-cache-miss: true
      - name: Validate cached IPA
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            test -s dist/Madeira.ipa
            unzip -tq dist/Madeira.ipa
            python3 tools/build/runtime-components.py ipa dist/Madeira.ipa
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - uses: actions/upload-artifact@v4
        with:
          name: MangoPort-ipa
          path: madeira/dist/Madeira.ipa
          if-no-files-found: error
          overwrite: true
          compression-level: 0
      - name: Report the failing step
        if: failure()
        working-directory: .
        shell: bash
        run: |
          f="$RUNNER_TEMP/step.log"
          [ -s "$f" ] || exit 0
          msg=$(tr '\r' '\n' < "$f" | sed -e 's/\x1b\[[0-9;]*m//g' | grep -v '^[[:space:]]*$' | tail -60 | cut -c1-400 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=${GITHUB_JOB} failed (last 60 lines)::${msg}"

  llvm:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ${{ vars.MANGO_MAC_RUNNER || 'macos-26' }}
    env:
      MADEIRA_PLANNED_SDK: ${{ needs.plan.outputs.sdk }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Madeira and apply Mango patches
        working-directory: .
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            scripts/apply-mango.sh --shallow
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - name: Select the newest Xcode
        working-directory: .
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            x=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
            xcodebuild -version
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: sdk
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            bash tools/build/ci-input-key.sh
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: cache
        uses: actions/cache@v4
        with:
          key: plan19-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.key }}-llvm-ios-15.0.7-${{ hashFiles('madeira/tools/build/build-llvm-ios.sh') }}
          path: |
            madeira/toolchains/llvm-ios-build/.madeira-cache.sha256
            madeira/toolchains/llvm-ios-build/lib/*.a
            madeira/toolchains/llvm-ios-build/include
            madeira/toolchains/llvm-project/llvm/include
      - name: Build LLVM for iOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            brew install ninja || true
            tools/build/build-llvm-ios.sh
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - name: Retain LLVM outputs for this run
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-llvm-${{ steps.sdk.outputs.key }}
          path: |
            madeira/toolchains/llvm-ios-build/.madeira-cache.sha256
            madeira/toolchains/llvm-ios-build/lib/*.a
            madeira/toolchains/llvm-ios-build/include
            madeira/toolchains/llvm-project/llvm/include
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Report the failing step
        if: failure()
        working-directory: .
        shell: bash
        run: |
          f="$RUNNER_TEMP/step.log"
          [ -s "$f" ] || exit 0
          msg=$(tr '\r' '\n' < "$f" | sed -e 's/\x1b\[[0-9;]*m//g' | grep -v '^[[:space:]]*$' | tail -60 | cut -c1-400 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=${GITHUB_JOB} failed (last 60 lines)::${msg}"

  fex:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ${{ vars.MANGO_MAC_RUNNER || 'macos-26' }}
    env:
      MADEIRA_PLANNED_SDK: ${{ needs.plan.outputs.sdk }}
    timeout-minutes: 360
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Madeira and apply Mango patches
        working-directory: .
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            scripts/apply-mango.sh --shallow
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - name: Select the newest Xcode
        working-directory: .
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            x=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
            xcodebuild -version
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: sdk
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            bash tools/build/ci-input-key.sh
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: key
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            echo "key=fex-ios-$(git rev-parse HEAD:FEX)-${{ hashFiles('madeira/tools/build/build-fex-ios.sh', 'madeira/build/fex-ios/build.sh') }}" >> "$GITHUB_OUTPUT"
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: cache
        uses: actions/cache@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-${{ steps.key.outputs.key }}
          path: |
            madeira/FEX/build-ios
            !madeira/FEX/build-ios/**/*.o
      - name: Build FEX for iOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            brew install ninja || true
            git submodule update --init --recursive --depth 1 FEX
            tools/build/build-fex-ios.sh
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - name: Retain FEX outputs for this run
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-fex-${{ steps.sdk.outputs.key }}
          path: |
            madeira/FEX/build-ios
            !madeira/FEX/build-ios/**/*.o
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Report the failing step
        if: failure()
        working-directory: .
        shell: bash
        run: |
          f="$RUNNER_TEMP/step.log"
          [ -s "$f" ] || exit 0
          msg=$(tr '\r' '\n' < "$f" | sed -e 's/\x1b\[[0-9;]*m//g' | grep -v '^[[:space:]]*$' | tail -60 | cut -c1-400 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=${GITHUB_JOB} failed (last 60 lines)::${msg}"

  i386:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ${{ vars.MANGO_MAC_RUNNER || 'macos-26' }}
    env:
      MADEIRA_PLANNED_SDK: ${{ needs.plan.outputs.sdk }}
    timeout-minutes: 360
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Madeira and apply Mango patches
        working-directory: .
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            scripts/apply-mango.sh --shallow
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - name: Select the newest Xcode
        working-directory: .
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            x=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
            xcodebuild -version
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: sdk
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            bash tools/build/ci-input-key.sh
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: key
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            echo "key=i386-windows-$(git rev-parse HEAD:wine)-$(git rev-parse HEAD:dxmt)-${{ hashFiles('madeira/build/wine-i386/**', 'madeira/build/dxmt-patches/**', 'madeira/tools/build/setup-llvm-mingw.sh', 'madeira/tools/build/build-shader-headers.sh') }}" >> "$GITHUB_OUTPUT"
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: cache
        uses: actions/cache@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-${{ steps.key.outputs.key }}
          path: madeira/app/Madeira/i386-windows
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          key: mingw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('madeira/tools/build/setup-llvm-mingw.sh') }}
          path: madeira/toolchains/llvm-mingw-*
      - name: Build the 32-bit (i386) Windows DLLs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            brew install meson ninja bison || true
            export PATH="$(brew --prefix bison)/bin:$PATH"
            git submodule update --init --depth 1 wine
            git submodule update --init --recursive --depth 1 dxmt
            tools/build/setup-llvm-mingw.sh
            # DXMT's i386 build compiles Metal shaders: it needs the Metal toolchain
            # and the Xcode 27 atomic fix that build-shader-headers.sh applies.
            xcodebuild -downloadComponent MetalToolchain
            tools/build/build-shader-headers.sh
            build/wine-i386/build.sh
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - if: failure()
        run: |
          set -o pipefail
          (
            tail -150 wine/build-i386/madeira-i386-build.log || true
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - name: Retain i386 outputs for this run
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-i386-${{ steps.sdk.outputs.key }}
          path: madeira/app/Madeira/i386-windows
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Report the failing step
        if: failure()
        working-directory: .
        shell: bash
        run: |
          f="$RUNNER_TEMP/step.log"
          [ -s "$f" ] || exit 0
          msg=$(tr '\r' '\n' < "$f" | sed -e 's/\x1b\[[0-9;]*m//g' | grep -v '^[[:space:]]*$' | tail -60 | cut -c1-400 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=${GITHUB_JOB} failed (last 60 lines)::${msg}"

  runtime:
    needs: [plan, llvm]
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ${{ vars.MANGO_MAC_RUNNER || 'macos-26' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        component: [dock, windows, moltenvk, zink, mesa-d3d12, vulkan-pe, kosmickrisp]
    env:
      MADEIRA_PLANNED_SDK: ${{ needs.plan.outputs.sdk }}
      MADEIRA_RUNTIME_SDK: ${{ needs.plan.outputs.sdk }}
      MADEIRA_RUNTIME_REUSE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Madeira and apply Mango patches
        working-directory: .
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            scripts/apply-mango.sh --shallow
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - name: Select the newest Xcode
        working-directory: .
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            x=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
            xcodebuild -version
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: sdk
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            bash tools/build/ci-input-key.sh
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: key
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            python3 tools/build/runtime-components.py key '${{ matrix.component }}' >> "$GITHUB_OUTPUT"
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - uses: actions/cache@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: madeira/.runtime-cache/${{ matrix.component }}
      - if: contains(fromJSON('["dock","windows","mesa-d3d12","vulkan-pe"]'), matrix.component)
        uses: actions/cache@v4
        with:
          key: mingw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('madeira/tools/build/setup-llvm-mingw.sh') }}
          path: madeira/toolchains/llvm-mingw-*
      - if: matrix.component == 'windows'
        uses: actions/download-artifact@v4
        with:
          name: native-llvm-${{ needs.plan.outputs.sdk }}
          path: madeira/toolchains
      - name: Build or verify runtime component
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            python3 tools/build/runtime-components.py build '${{ matrix.component }}'
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      # Each completed component survives a failure in another component or app.
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.component }}
          path: madeira/.runtime-cache
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Report the failing step
        if: failure()
        working-directory: .
        shell: bash
        run: |
          f="$RUNNER_TEMP/step.log"
          [ -s "$f" ] || exit 0
          msg=$(tr '\r' '\n' < "$f" | sed -e 's/\x1b\[[0-9;]*m//g' | grep -v '^[[:space:]]*$' | tail -60 | cut -c1-400 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=${GITHUB_JOB} failed (last 60 lines)::${msg}"

  app:
    needs: [plan, llvm, fex, i386, runtime]
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ${{ vars.MANGO_MAC_RUNNER || 'macos-26' }}
    env:
      MADEIRA_PLANNED_SDK: ${{ needs.plan.outputs.sdk }}
      MADEIRA_PLANNED_IPA: ${{ needs.plan.outputs.ipaenv }}
      MADEIRA_RUNTIME_SDK: ${{ needs.plan.outputs.sdk }}
      MADEIRA_RUNTIME_REUSE: '1'
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Madeira and apply Mango patches
        working-directory: .
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            scripts/apply-mango.sh
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - name: Select the newest Xcode
        working-directory: .
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            x=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
            xcodebuild -version
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: sdk
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            bash tools/build/ci-input-key.sh
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - id: cache-llvm
        uses: actions/cache/restore@v4
        with:
          key: plan19-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.key }}-llvm-ios-15.0.7-${{ hashFiles('madeira/tools/build/build-llvm-ios.sh') }}
          path: |
            madeira/toolchains/llvm-ios-build/.madeira-cache.sha256
            madeira/toolchains/llvm-ios-build/lib/*.a
            madeira/toolchains/llvm-ios-build/include
            madeira/toolchains/llvm-project/llvm/include
      - id: cache-fex
        uses: actions/cache/restore@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-${{ needs.fex.outputs.key }}
          path: |
            madeira/FEX/build-ios
            !madeira/FEX/build-ios/**/*.o
      - id: cache-i386
        uses: actions/cache/restore@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-${{ needs.i386.outputs.key }}
          path: madeira/app/Madeira/i386-windows
      # These artifacts belong to this workflow run and the planned SDK.
      - name: Recover LLVM outputs from this run
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: native-llvm-${{ needs.plan.outputs.sdk }}
          path: madeira/toolchains
      - name: Recover FEX outputs from this run
        if: steps.cache-fex.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: native-fex-${{ needs.plan.outputs.sdk }}
          path: madeira/FEX/build-ios
      - name: Recover i386 outputs from this run
        id: transfer-i386
        if: steps.cache-i386.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: native-i386-${{ needs.plan.outputs.sdk }}
          path: madeira/app/Madeira/i386-windows
      # Independent caches retain libraries whose own build inputs have not changed.
      - id: pins
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            echo "wine=$(git rev-parse HEAD:wine)" >> "$GITHUB_OUTPUT"
            echo "dxmt=$(git rev-parse HEAD:dxmt)" >> "$GITHUB_OUTPUT"
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      # Seed the split caches only when every legacy input still matches.
      - uses: actions/cache/restore@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-deps-v2-${{ hashFiles('madeira/build/gnutls-ios/**', 'madeira/build/ffmpeg/build.sh', 'madeira/build/ffmpeg/src/**', 'madeira/build/freetype-ios/build.sh', 'madeira/tools/build/build-freetype-ios.sh', 'madeira/tools/build/setup-llvm-mingw.sh') }}
          path: |
            madeira/toolchains/llvm-mingw-*
            madeira/toolchains/gnutls-ios
            madeira/build/gnutls-ios/obj/*.done
            madeira/toolchains/ffmpeg-ios
            madeira/build/ffmpeg/obj
            madeira/build/freetype-ios/build
            madeira/research/freetype
      - id: cache-mingw
        uses: actions/cache@v4
        with:
          key: mingw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('madeira/tools/build/setup-llvm-mingw.sh') }}
          path: madeira/toolchains/llvm-mingw-*
      - id: cache-gnutls
        uses: actions/cache@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-gnutls-${{ hashFiles('madeira/build/gnutls-ios/build.sh', 'madeira/build/gnutls-ios/src/**', 'madeira/tools/build/sync-gnutls-libs.sh') }}
          path: |
            madeira/toolchains/gnutls-ios
            madeira/build/gnutls-ios/obj/*.done
      - id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-ffmpeg-${{ hashFiles('madeira/build/ffmpeg/build.sh', 'madeira/build/ffmpeg/src/**') }}
          path: |
            madeira/toolchains/ffmpeg-ios
            madeira/build/ffmpeg/obj
      - id: cache-freetype
        uses: actions/cache@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-freetype-${{ hashFiles('madeira/build/freetype-ios/build.sh', 'madeira/tools/build/build-freetype-ios.sh') }}
          path: |
            madeira/build/freetype-ios/build
            madeira/research/freetype
      - id: cache-rppairing
        uses: actions/cache@v4
        with:
          key: plan19-${{ steps.sdk.outputs.rust }}-rppairing-${{ hashFiles('madeira/build/rppairing-ios/**', 'madeira/.cargo/**', 'madeira/rust-toolchain', 'madeira/rust-toolchain.toml') }}
          path: |
            madeira/app/Madeira/libmadeira_rppairing.a
            madeira/app/Madeira/legal/LICENSES-rppairing-crates.txt
      - uses: actions/cache@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-wine-host-${{ steps.pins.outputs.wine }}-${{ hashFiles('madeira/tools/build/build-wine.sh', 'madeira/tools/build/setup-llvm-mingw.sh') }}
          path: |
            madeira/wine/build-macos
            madeira/wine/build-arm64ec
      - uses: actions/cache@v4
        with:
          key: plan19-${{ steps.sdk.outputs.graphics }}-dxmt-ios-${{ steps.pins.outputs.dxmt }}-${{ steps.pins.outputs.wine }}-${{ hashFiles('madeira/build/dxmt-ios/build.sh', 'madeira/build/dxmt-patches/**', 'madeira/tools/build/build-dxmt-ios.sh', 'madeira/tools/build/build-shader-headers.sh', 'madeira/tools/build/build-llvm-ios.sh', 'madeira/build/madeira-d3d12/deps.sh', 'madeira/madeira-d3d12/src/**', 'madeira/madeira-d3d12/tests/native/**', 'madeira/madeira-d3d12/third_party/**', 'madeira/app/Madeira/d3d12/**') }}
          path: |
            madeira/app/Madeira/libdxmt_combined.a
            madeira/build/dxmt-ios/shader-headers
      - name: Rebuild missing 32-bit DLLs
        if: steps.cache-i386.outputs.cache-hit != 'true' && steps.transfer-i386.outcome != 'success'
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            brew install meson ninja bison
            export PATH="$(brew --prefix bison)/bin:$PATH"
            tools/build/setup-llvm-mingw.sh
            xcodebuild -downloadComponent MetalToolchain
            tools/build/build-shader-headers.sh
            build/wine-i386/build.sh
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - name: Recover runtime components from this run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: madeira/.runtime-cache
          merge-multiple: true
      - name: Build IPA
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/step.log"
          (
            tools/build-ipa.sh
          ) 2>&1 | tee -a "$RUNNER_TEMP/step.log"
      - uses: actions/cache/save@v4
        with:
          key: ${{ needs.plan.outputs.ipa }}
          path: madeira/dist/Madeira.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MangoPort-ipa
          path: madeira/dist/Madeira.ipa
          if-no-files-found: error
          overwrite: true
          compression-level: 0
      - name: Report the failing step
        if: failure()
        working-directory: .
        shell: bash
        run: |
          f="$RUNNER_TEMP/step.log"
          [ -s "$f" ] || exit 0
          msg=$(tr '\r' '\n' < "$f" | sed -e 's/\x1b\[[0-9;]*m//g' | grep -v '^[[:space:]]*$' | tail -60 | cut -c1-400 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=${GITHUB_JOB} failed (last 60 lines)::${msg}"

  release:
    needs: [reuse, app]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release') && (needs.app.result == 'success' || needs.reuse.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MangoPort-ipa
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag build uses its tag; a release-branch build uses the newest '## vX.Y.Z' in the changelog.
          if [ "${GITHUB_REF_TYPE}" = tag ]; then TAG="${GITHUB_REF_NAME}"
          else TAG=$(awk '/^## v/ {print $2; exit}' docs/CHANGELOG.md); fi
          test -n "$TAG"
          mv dist/Madeira.ipa "dist/MangoPort-$TAG.ipa"
          awk -v tag="## $TAG" '$0 == tag {on=1; next} /^## / {on=0} on' docs/CHANGELOG.md > notes.md
          test -s notes.md || echo "Mango Port $TAG" > notes.md
          gh release create "$TAG" "dist/MangoPort-$TAG.ipa" --title "Mango Port $TAG" --notes-file notes.md --target "$GITHUB_SHA"
